name: digest
on:
  schedule:
    - cron: "0 23 * * *"   # 매일 08:00 KST (UTC 23:00). GitHub 사정으로 수십 분 늦을 수 있음
  workflow_dispatch:

permissions:
  contents: write   # state/·digests/ 커밋용

concurrency:
  group: bueong-state   # state/를 고치는 작업끼리 겹치지 않게 (watch.yml과 같은 그룹)
  cancel-in-progress: false
  queue: max   # watch와 같은 시각에 겹쳐도 취소되지 않고 줄을 선다

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # 예약 시점 SHA가 아니라 지금 브랜치 끝의 state/를 읽는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: prepare
        run: python src/digest.py prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # 없으면 중요도 정렬 없이 출처별 목록으로 보낸다
      - name: 전체 목록·메시지 확정분 게시 (링크가 404가 되지 않게 전송보다 먼저)
        if: steps.prepare.outputs.saved == 'true'
        run: bash .github/commit-state.sh digest-prepare
      - id: send
        run: python src/digest.py send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 보낸 진행도 커밋 (실패했어도 성공한 조각까지)
        if: always() && steps.send.outputs.saved == 'true'
        run: bash .github/commit-state.sh digest-send
